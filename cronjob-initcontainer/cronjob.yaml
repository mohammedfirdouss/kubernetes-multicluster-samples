apiVersion: batch/v1
kind: CronJob
metadata:
  name: hello-cron
  labels:
    app: hello-cron
spec:
  schedule: "*/5 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          initContainers:
            - name: init-job
              image: busybox:1.36
              command: ["sh", "-c", "echo preparing job"]
          containers:
            - name: main-job
              image: busybox:1.36
              command: ["sh", "-c", "echo hello from cronjob"]
          restartPolicy: OnFailure
