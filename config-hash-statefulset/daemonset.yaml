apiVersion: v1
kind: Secret
metadata:
  name: ds-secret
type: Opaque
stringData:
  token: secret-value1
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: simple-ds
  labels:
    app: simple-ds
spec:
  selector:
    matchLabels:
      app: simple-ds
  template:
    metadata:
      labels:
        app: simple-ds
    spec:
      # Tolerate all taints so the DaemonSet schedules on every node,
      # including single-node / control-plane-tainted kind clusters.
      tolerations:
        - operator: Exists
      containers:
      - name: helloworld
        image: ghcr.io/pipe-cd/helloworld:v0.33.0
        args:
          - server
        ports:
        - containerPort: 9085
        envFrom:
        - secretRef:
            name: ds-secret
