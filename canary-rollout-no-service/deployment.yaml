apiVersion: apps/v1
kind: Deployment
metadata:
  name: simple
  labels:
    app: simple
  annotations:
    pipecd.dev/ignore-drift-detection: "true"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: simple
  template:
    metadata:
      labels:
        app: simple
    spec:
      containers:
      - name: helloworld
        image: ghcr.io/pipe-cd/helloworld:v0.33.0
        args:
          - server
        ports:
        - containerPort: 9085
